<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Mini Monitoring</h1>
    <div class="topbar-right">
      <a class="button" href="/targets/new">+ Добавить цель</a>
      <span id="updated" class="muted">загружаю данные…</span>
      <a href="/docs">API</a>
    </div>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Цель</th>
          <th>Тип</th>
          <th>Статус</th>
          <th>Задержка</th>
          <th>Доступность 24 ч</th>
          <th>Проверок 24 ч</th>
          <th>Последняя проверка</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <p id="empty" class="muted hidden">
      Целей пока нет. Нажмите «+ Добавить цель» — или добавьте их через
      <a href="/docs">Swagger UI</a>.
    </p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
